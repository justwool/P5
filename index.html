<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organic Partition Studies</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="controls">
        <h1>Organic Partition Studies</h1>
        <p>
          A deterministic p5.js reconstruction of the image logic: rotated geometric
          frames, tensioned organic partitions, patterned cells, anchor knots, and
          trailing filaments.
        </p>
        <div class="buttons">
          <button id="presetA">Preset A</button>
          <button id="presetB">Preset B</button>
          <button id="rerender">Rerender</button>
          <button id="saveBtn">Save PNG</button>
        </div>
        <p class="hint">
          Press <strong>1</strong>/<strong>2</strong> to switch presets and
          <strong>S</strong> to save.
        </p>
      </section>
      <section id="canvas-host" class="canvas-host"></section>
    </main>
    <script src="sketch.js"></script>
  </body>
</html>
